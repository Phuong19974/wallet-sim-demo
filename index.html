/* Project X Wallet — spot simulator (placeholder name). Offline-only. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stage);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
html{font-size:16px}
body{
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-weight:400;
  line-height:1.3;
  overflow:hidden;
  font-feature-settings:"tnum" 1,"kern" 1;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;appearance:none;-webkit-appearance:none}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.42}
input:focus,button:focus{outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img,svg{display:block}
ul,ol{list-style:none}
:root{
  --stage:#d9dbe2;
  --bg:#ffffff;
  --tile:#f3f4f6;
  --tile-2:#eceef1;
  --hover:#f6f7f8;
  --line:rgba(15,16,20,.08);
  --line-2:rgba(15,16,20,.12);
  --text:#111213;
  --muted:#6b6f76;
  --faint:#9aa0a6;
  --green:#1f7a3a;
  --green-bg:rgba(31,122,58,.08);
  --red:#c0392b;
  --red-bg:rgba(192,57,43,.08);
  --blue:#2d6bff;
  --blue-2:#1f5aee;
  --accent:#3c4fd8;
  --accent-soft:#eef0fb;
  --badge-bg:#f3f4f8;
  --badge-fg:#4a4e6a;
  --shadow-phone:0 18px 50px rgba(20,22,30,.18),0 2px 8px rgba(20,22,30,.08);
  --r-tile:16px;
  --r-card:16px;
  --r-sheet:20px;
  --header-h:52px;
  --status-h:44px;
  --tab-h:76px;
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:180ms;
}
.num, .usd, .qty, .chg, .balance, .mono{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

/* ===== Desktop stage / phone frame ===== */
.stage{
  min-height:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(255,255,255,.55), transparent 60%),
    var(--stage);
  position:relative;
}
.stage-tools{
  position:absolute;
  top:24px; right:24px;
  display:flex; gap:8px; z-index:5;
}
.tool-btn{
  height:32px; padding:0 12px;
  border-radius:8px;
  background:#fff;
  border:1px solid var(--line-2);
  color:var(--text);
  font-size:12px; font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:background var(--dur),transform 80ms;
}
.tool-btn:hover{background:#f7f7f8}
.tool-btn:active{transform:scale(.98)}
.phone-frame{
  width:410px; height:864px;
  background:#0e0f12;
  border-radius:48px;
  padding:10px;
  box-shadow:var(--shadow-phone);
  position:relative;
  flex:0 0 auto;
}
.phone-frame::before{
  content:"";
  position:absolute;
  top:14px; left:50%;
  transform:translateX(-50%);
  width:96px; height:10px;
  background:#0e0f12;
  border-radius:8px;
  z-index:3;
  pointer-events:none;
}
.phone-screen{
  width:390px; height:844px;
  border-radius:38px;
  overflow:hidden;
  background:var(--bg);
  position:relative;
  isolation:isolate;
}
/* Full view */
.stage.full .phone-frame{
  width:min(1120px, calc(100vw - 64px));
  height:min(800px, calc(100vh - 64px));
  border-radius:20px;
  padding:0;
}
.stage.full .phone-frame::before{display:none}
.stage.full .phone-screen{
  width:100%; height:100%;
  border-radius:20px;
  display:flex;
}
.stage.full .app{width:440px; min-width:400px; border-right:1px solid var(--line); height:100%}
.stage.full .full-pane{display:flex}
.full-pane{
  display:none;
  flex:1;
  background:#f7f8fa;
  min-width:0;
  flex-direction:column;
}
.full-pane-head{
  height:64px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--line);
  background:#fff;
}
.full-pane-head h2{font-size:15px; font-weight:600}
.full-pane-head .pair-meta{font-size:12px; color:var(--muted)}
.full-chart{flex:1; padding:16px 20px 24px; display:flex; flex-direction:column; min-height:0}
.full-chart svg{width:100%; flex:1}

@media (max-width:500px){
  .stage{background:#fff; display:block}
  .stage-tools{display:none}
  .phone-frame{
    width:100vw; height:100vh; height:100dvh;
    border-radius:0; padding:0; box-shadow:none; background:#fff;
  }
  .phone-frame::before{display:none}
  .phone-screen{
    width:100%; height:100%;
    border-radius:0;
  }
}

/* ===== App shell ===== */
.app{
  height:100%;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
.status-bar{
  height:var(--status-h);
  padding:12px 24px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 auto;
  font-size:14px;
  font-weight:600;
  letter-spacing:-0.01em;
  user-select:none;
}
.status-bar .sys{display:flex; align-items:center; gap:6px}
.status-bar svg{display:block}

.app-header{
  height:var(--header-h);
  padding:0 12px 0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 auto;
  background:var(--bg);
  z-index:10;
}
.acct{
  display:flex; align-items:center; gap:8px;
  min-width:0; padding:4px 6px 4px 2px;
  border-radius:10px;
  transition:background var(--dur);
}
.acct:hover{background:var(--hover)}
.identicon{
  width:28px; height:28px; border-radius:8px; overflow:hidden; flex:0 0 auto;
}
.identicon svg{width:28px; height:28px}
.acct-name{
  font-size:15px; font-weight:600; letter-spacing:-0.015em;
  display:flex; align-items:center; gap:3px;
  white-space:nowrap;
}
.acct-name .chev{color:var(--muted); display:flex}
.head-actions{display:flex; align-items:center; gap:2px}
.icon-btn{
  width:36px; height:36px;
  display:grid; place-items:center;
  border-radius:10px;
  color:var(--text);
  position:relative;
  transition:background var(--dur);
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:22px; height:22px}
.dot{
  position:absolute; top:7px; right:7px;
  width:7px; height:7px; border-radius:50%;
  background:#e03131;
  box-shadow:0 0 0 2px #fff;
}

.sim-tag{
  flex:0 0 auto;
  display:flex; justify-content:center;
  padding:0 16px 2px;
  background:var(--bg);
  z-index:10;
}
.sim-tag span{
  font-size:10px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--badge-fg);
  background:var(--badge-bg);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 8px;
  line-height:1.2;
  text-transform:none;
}

/* Scroll region */
.scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  overscroll-behavior-y:contain;
  position:relative;
  background:var(--bg);
}
.scroll-inner{min-height:100%; padding-bottom:12px; will-change:transform}
.ptr{
  position:absolute; top:0; left:0; right:0;
  height:56px;
  display:flex; align-items:center; justify-content:center;
  transform:translateY(-56px);
  pointer-events:none;
  color:var(--muted);
}
.ptr-spinner{
  width:22px; height:22px;
  border:2.5px solid #d5d7dc;
  border-top-color:#111;
  border-radius:50%;
}
.ptr.spin .ptr-spinner{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Home: balance */
.home-balance{
  text-align:center;
  padding:10px 20px 4px;
}
.balance{
  font-family:"IBM Plex Sans Condensed","Inter Tight",system-ui,sans-serif;
  font-weight:700;
  font-size:56px;
  letter-spacing:-0.035em;
  line-height:1;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.today{
  margin-top:6px;
  font-size:13px;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.today.neg{color:var(--red)}
.today .label{font-weight:500; color:var(--muted); margin-left:2px}
.sim-caption{
  margin-top:4px;
  font-size:12px;
  font-weight:500;
  line-height:1.3;
  color:var(--muted);
  letter-spacing:-0.01em;
}

/* Action tiles */
.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:12px 16px 4px;
}
.action{
  background:var(--tile);
  border-radius:var(--r-tile);
  height:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background var(--dur),transform 80ms;
}
.action:hover{background:var(--tile-2)}
.action:active{transform:scale(.97)}
.action .ic{
  width:24px; height:24px;
  color:var(--text);
}
.action .ic svg{width:24px; height:24px}
.action span{
  font-size:12px;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--text);
}

/* Promo */
.promo-wrap{padding:6px 16px 2px}
.promo{
  background:linear-gradient(180deg,#f4f6fb 0%,#eef1f7 100%);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:10px 12px;
  display:flex;
  gap:12px;
  align-items:center;
  position:relative;
  text-align:left;
  width:100%;
}
.promo-art{
  width:52px; height:52px; flex:0 0 auto;
  border-radius:12px;
  background:#e4e8f2;
  overflow:hidden;
}
.promo-art svg{width:52px; height:52px}
.promo-body{flex:1; min-width:0; padding-right:16px}
.promo-body strong{
  display:block;
  font-size:13px; font-weight:650;
  letter-spacing:-0.01em;
  margin-bottom:2px;
}
.promo-body p{
  font-size:12px;
  color:var(--muted);
  line-height:1.35;
}
.promo-x{
  position:absolute; top:8px; right:8px;
  width:24px; height:24px;
  display:grid; place-items:center;
  color:var(--muted);
  border-radius:8px;
}
.promo-x:hover{background:rgba(0,0,0,.05)}

/* Allocation rows */
.alloc{padding:4px 8px 0}
.alloc-row,.token-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  border-radius:12px;
  transition:background var(--dur);
}
.alloc-row{padding:10px 12px; min-height:48px}
.alloc-row:hover,.token-row:hover{background:var(--hover)}
.alloc-left{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.alloc-title{
  font-size:15px; font-weight:600; letter-spacing:-0.015em;
  display:flex; align-items:baseline; gap:6px;
}
.alloc-title .dotsep{color:var(--faint); font-weight:500; font-size:13px}
.alloc-mid{
  display:flex; align-items:center; gap:8px;
  font-size:13px; color:var(--muted); font-weight:500;
}
.apy{color:var(--green); font-weight:600; font-size:13px}
.add-mini{
  width:22px; height:22px; border-radius:50%;
  background:var(--tile);
  display:grid; place-items:center;
  color:var(--text);
}
.add-mini svg{width:12px; height:12px}
.alloc-right{
  font-size:15px; font-weight:600;
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
}

.divider{height:1px; background:var(--line); margin:4px 20px}

.section-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 20px 4px;
  font-size:16px; font-weight:650; letter-spacing:-0.02em;
}
.section-head .chev{color:var(--muted); display:flex}

/* Token list */
.token-list{padding:0 8px}
.token-row{padding:8px 12px; min-height:60px}
.tok-ic{
  width:40px; height:40px; flex:0 0 auto;
  position:relative;
}
.tok-ic .mark{
  width:40px; height:40px; border-radius:50%;
  overflow:hidden;
}
.tok-ic .mark svg{width:40px; height:40px}
.chain-badge{
  position:absolute; right:-2px; bottom:-2px;
  width:16px; height:16px; border-radius:50%;
  border:2px solid #fff;
  overflow:hidden;
  background:#fff;
}
.chain-badge svg{width:16px; height:16px}
.tok-mid{flex:1; min-width:0}
.tok-name{font-size:15px; font-weight:600; letter-spacing:-0.015em; color:var(--text)}
.tok-px{
  margin-top:2px;
  font-size:12px; color:var(--muted);
  display:flex; align-items:center; gap:6px;
  font-variant-numeric:tabular-nums;
}
.chg{font-weight:600}
.chg.up{color:var(--green)}
.chg.dn{color:var(--red)}
.tok-right{text-align:right;flex:0 0 auto;max-width:46%}
.tok-qty,.tok-usd{white-space:nowrap}
.tok-usd{font-size:15px; font-weight:600; letter-spacing:-0.02em; font-variant-numeric:tabular-nums}
.tok-qty{margin-top:2px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

/* Tab bar */
.tabbar{
  flex:0 0 auto;
  height:var(--tab-h);
  padding:0 6px 16px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:end;
  background:var(--bg);
  border-top:1px solid var(--line);
  z-index:12;
  position:relative;
}
.tab{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  gap:4px;
  height:56px;
  color:var(--faint);
  font-size:10px; font-weight:500;
  letter-spacing:-0.01em;
  padding-bottom:2px;
}
.tab svg{width:24px; height:24px}
.tab.on{color:var(--text); font-weight:600}
.tab-plus{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  gap:4px;
  height:64px;
  font-size:10px; font-weight:500; color:var(--faint);
  padding-bottom:2px;
}
.tab-plus .fab{
  width:44px; height:44px; border-radius:50%;
  background:var(--blue);
  color:#fff;
  display:grid; place-items:center;
  box-shadow:0 6px 16px rgba(45,107,255,.35);
  margin-bottom:2px;
  transition:transform 80ms, background var(--dur);
  position:relative; top:-8px;
}
.tab-plus .fab:hover{background:var(--blue-2)}
.tab-plus .fab:active{transform:scale(.96)}
.tab-plus .fab svg{width:22px; height:22px}
.tab-plus span{position:relative; top:-6px}

.home-ind{
  position:absolute; left:50%; bottom:7px;
  transform:translateX(-50%);
  width:120px; height:4px; border-radius:4px;
  background:#111;
  opacity:.9;
}

/* ===== Overlays / sheets (inside phone) ===== */
.backdrop{
  position:absolute; inset:0;
  background:rgba(16,18,22,.4);
  opacity:0; pointer-events:none;
  transition:opacity 200ms ease;
  z-index:30;
}
.backdrop.on{opacity:1; pointer-events:auto}
.sheet{
  position:absolute; left:0; right:0; bottom:0;
  background:#fff;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  transform:translateY(110%);
  transition:transform 280ms var(--ease);
  z-index:31;
  max-height:92%;
  display:flex; flex-direction:column;
  box-shadow:0 -8px 32px rgba(0,0,0,.12);
}
.sheet.on{transform:translateY(0)}
.sheet.sheet-mid{max-height:78%}
.sheet.sheet-tall{max-height:94%; height:94%}
.handle{
  width:36px; height:4px; border-radius:4px;
  background:#d5d7dc;
  margin:8px auto 0;
  flex:0 0 auto;
}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px 12px;
  flex:0 0 auto;
}
.sheet-head h2{font-size:17px; font-weight:650; letter-spacing:-0.02em}
.sheet-body{
  padding:0 16px 24px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  flex:1;
}
.sheet-foot{
  padding:8px 16px 24px;
  flex:0 0 auto;
  border-top:1px solid var(--line);
  background:#fff;
}

/* Buttons */
.btn{
  height:52px; width:100%;
  border-radius:14px;
  font-size:16px; font-weight:650;
  letter-spacing:-0.015em;
  display:flex; align-items:center; justify-content:center;
  gap:8px;
  transition:background var(--dur),transform 80ms,opacity var(--dur);
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--text); color:#fff}
.btn-primary:hover{background:#000}
.btn-blue{background:var(--blue); color:#fff}
.btn-blue:hover{background:var(--blue-2)}
.btn-ghost{background:var(--tile); color:var(--text)}
.btn-ghost:hover{background:var(--tile-2)}
.btn-danger{background:var(--red); color:#fff}
.btn-row{display:flex; gap:8px}
.btn-sm{height:40px; border-radius:12px; font-size:14px}

/* Onboarding */
.welcome{
  position:absolute; inset:0;
  background:var(--bg);
  z-index:20;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px 28px 48px;
  text-align:center;
}
.welcome.hidden{display:none}
.logo-mark{width:72px; height:72px; margin-bottom:20px}
.welcome h1{font-size:24px; font-weight:700; letter-spacing:-0.03em}
.welcome .ph{font-size:12px; color:var(--muted); margin-top:4px; font-weight:500}
.welcome .lead{font-size:15px; color:var(--muted); margin:16px 0 24px; line-height:1.45; max-width:280px}
.welcome .sim-tag{padding:0 0 24px}

/* Forms */
.field{margin-bottom:12px}
.field label{
  display:block; font-size:12px; font-weight:600; color:var(--muted);
  margin-bottom:6px;
}
.field-box,.input,.select-like{
  background:var(--tile);
  border:1px solid transparent;
  border-radius:14px;
  padding:12px 14px;
}
.input{
  width:100%;
  font-size:16px; font-weight:500;
}
.input:focus{border-color:var(--line-2); background:#fff}
.swap-card{
  background:var(--tile);
  border-radius:16px;
  padding:14px 14px 12px;
}
.swap-card + .swap-mid{height:0; position:relative; z-index:2}
.swap-flip{
  position:absolute; left:50%; top:-18px;
  transform:translateX(-50%);
  width:36px; height:36px; border-radius:10px;
  background:#fff;
  border:3px solid #fff;
  box-shadow:0 0 0 1px var(--line-2);
  display:grid; place-items:center;
  color:var(--text);
}
.swap-flip:hover{background:var(--hover)}
.swap-card .row1{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; color:var(--muted); font-weight:500;
  margin-bottom:8px;
}
.swap-card .row2{display:flex; align-items:center; gap:8px}
.tok-pick{
  display:flex; align-items:center; gap:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px 6px 6px;
  font-size:15px; font-weight:650;
  flex:0 0 auto;
}
.tok-pick .s{width:24px; height:24px; border-radius:50%; overflow:hidden}
.tok-pick .s svg{width:24px; height:24px}
.amt{
  flex:1; text-align:right;
  font-size:28px; font-weight:650;
  letter-spacing:-0.03em;
  font-variant-numeric:tabular-nums;
  min-width:0;
  background:transparent;
  width:100%;
}
.amt::placeholder{color:var(--faint)}
.max-btn{
  font-size:12px; font-weight:700; color:var(--accent);
  padding:2px 4px;
}
.usd-approx{margin-top:6px; font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.quote-rows{margin:16px 0 8px}
.q-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:7px 0;
  font-size:13px;
}
.q-row .k{color:var(--muted); font-weight:500}
.q-row .v{font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
.slip-row{display:flex; gap:6px; align-items:center}
.chip{
  height:28px; padding:0 10px;
  border-radius:999px;
  background:var(--tile);
  font-size:12px; font-weight:650;
  color:var(--muted);
  border:1px solid transparent;
}
.chip.on{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.chip-input{
  width:72px; height:28px; border-radius:999px;
  background:var(--tile); text-align:center;
  font-size:12px; font-weight:650;
  border:1px solid transparent;
}
.chip-input.on{background:var(--accent-soft); color:var(--accent)}

/* Lists in sheets */
.menu-list{padding:4px 0 8px}
.menu-item{
  width:100%;
  display:flex; align-items:center; gap:12px;
  padding:14px 4px;
  border-radius:12px;
  font-size:15px; font-weight:550;
  text-align:left;
}
.menu-item:hover{background:var(--hover)}
.menu-item .ic{
  width:36px; height:36px; border-radius:10px;
  background:var(--tile);
  display:grid; place-items:center;
  flex:0 0 auto;
}
.menu-item .ic svg{width:18px; height:18px}
.menu-item .sub{display:block; font-size:12px; color:var(--muted); font-weight:450; margin-top:1px}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--tile); border-radius:12px;
  padding:10px 12px; margin-bottom:8px;
  color:var(--muted);
}
.search-box input{flex:1; font-size:15px; font-weight:500; background:transparent; color:var(--text)}

/* Activity */
.act-item{
  width:100%;
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 8px;
  border-radius:12px;
  text-align:left;
}
.act-item:hover{background:var(--hover)}
.act-ic{
  width:40px; height:40px; border-radius:50%;
  background:var(--tile);
  display:grid; place-items:center;
  flex:0 0 auto;
}
.act-ic svg{width:18px; height:18px}
.act-mid{flex:1; min-width:0}
.act-title{font-size:15px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.act-sub{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.act-right{text-align:right; flex:0 0 auto; max-width:48%}
.act-amt{font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap}
.st{
  display:inline-block;
  font-size:11px; font-weight:650;
  padding:2px 6px; border-radius:6px;
  margin-top:4px;
}
.st.ok{background:var(--green-bg); color:var(--green)}
.st.fail{background:var(--red-bg); color:var(--red)}
.st.pend{background:var(--tile); color:var(--muted)}
.hash{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; margin-top:4px; white-space:nowrap}

/* Token detail */
.td-head{padding:8px 8px 0; text-align:center}
.td-icon{width:56px; height:56px; margin:0 auto 10px; border-radius:50%; overflow:hidden}
.td-icon svg{width:56px; height:56px}
.td-head h3{font-size:18px; font-weight:700; letter-spacing:-0.02em}
.td-net{font-size:12px; color:var(--muted); margin-top:2px}
.td-price{
  font-family:"IBM Plex Sans Condensed","Inter Tight",sans-serif;
  font-weight:700; font-size:36px; letter-spacing:-0.03em;
  margin-top:12px; font-variant-numeric:tabular-nums;
}
.td-chg{margin-top:4px; font-size:14px; font-weight:600}
.td-chart{height:180px; margin:12px -4px 8px}
.td-chart svg{width:100%; height:180px}
.td-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 16px}
.stat{
  background:var(--tile); border-radius:12px; padding:12px;
}
.stat .k{font-size:11px; color:var(--muted); font-weight:600}
.stat .v{font-size:15px; font-weight:650; margin-top:4px; font-variant-numeric:tabular-nums}

/* Receive */
.recv{text-align:center; padding:8px 8px 16px}
.qr-wrap{
  width:220px; height:220px; margin:8px auto 16px;
  background:#fff; border:1px solid var(--line);
  border-radius:16px; padding:12px;
}
.qr-wrap svg{width:100%; height:100%}
.addr-full{
  font-size:13px; font-weight:600;
  word-break:break-all;
  letter-spacing:-0.01em;
  line-height:1.4;
  padding:0 12px;
  font-variant-numeric:tabular-nums;
}

/* Pending / success */
.state-view{
  text-align:center; padding:32px 16px 16px;
}
.state-view .big-ic{width:64px; height:64px; margin:0 auto 16px}
.spin-lg{
  width:56px; height:56px; margin:0 auto 16px;
  border:3px solid var(--line-2);
  border-top-color:var(--text);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
.state-view h3{font-size:20px; font-weight:700; letter-spacing:-0.02em}
.state-view p{color:var(--muted); margin-top:8px; font-size:14px; line-height:1.45}

/* Toast */
.toast{
  position:absolute; left:50%; bottom:96px;
  transform:translate(-50%, 12px);
  background:#1a1b1e; color:#fff;
  font-size:13px; font-weight:600;
  padding:10px 14px; border-radius:12px;
  opacity:0; pointer-events:none;
  transition:opacity 180ms, transform 180ms var(--ease);
  z-index:50; white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.toast.on{opacity:1; transform:translate(-50%, 0)}

/* Misc pages inside scroll */
.page-pad{padding:16px 20px 24px}
.page-pad h2{font-size:22px; font-weight:700; letter-spacing:-0.03em; margin-bottom:8px}
.page-pad .lead{color:var(--muted); font-size:14px; margin-bottom:20px}
.empty{text-align:center; color:var(--muted); padding:40px 16px; font-size:14px}
.news-card{
  background:var(--tile);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  text-align:left;
  width:100%;
}
.news-card h3{font-size:14px; font-weight:650; letter-spacing:-0.01em}
.news-card p{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4}
.news-card .when{font-size:11px; color:var(--faint); margin-top:8px}

/* Settings */
.set-group{margin:8px 0 20px}
.set-label{font-size:12px; font-weight:650; color:var(--muted); margin:0 4px 8px; letter-spacing:.02em; text-transform:uppercase}
.set-row{
  width:100%;
  display:flex; align-items:center; gap:12px;
  padding:14px 12px;
  background:var(--tile);
  border-radius:12px;
  margin-bottom:6px;
  text-align:left;
  font-size:15px; font-weight:550;
}
.set-row .grow{flex:1}
.set-row .val{color:var(--muted); font-size:13px; font-weight:500}
.set-row.on{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* Confirm rows */
.kv{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted); font-weight:500}
.kv .v{font-weight:600; text-align:right; font-variant-numeric:tabular-nums}

.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

#app-main{display:flex;flex-direction:column;height:100%;min-height:0;flex:1}

</style>

<body>
  <div class="stage">

      for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) {
        const edge = i === 0 || i === 6 || j === 0 || j === 6;
        const mid = i >= 2 && i <= 4 && j >= 2 && j <= 4;
        cells[y + i][x + j] = edge || mid;
      }
    };
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const inFinder = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      if (!inFinder) cells[y][x] = rnd() > 0.53;
    }
    const s = 200 / n;
    let r = "";
    cells.forEach((row, y) => row.forEach((on, x) => {
      if (on) r += `<rect x="${(x * s).toFixed(2)}" y="${(y * s).toFixed(2)}" width="${s.toFixed(2)}" height="${s.toFixed(2)}" rx="0.4"/>`;
    }));
    return `<svg viewBox="0 0 200 200" fill="#111">${r}</svg>`;
  }

  function seedPrices() {
    const prices = {};

    const history = {};
    Object.keys(TOKENS).forEach((k) => {
      prices[k] = TOKENS[k].seed;
      prev[k] = TOKENS[k].seed / (1 + (DAY_CHG[k] || 0));
      const rnd = mulberry32(hashStr("hist:" + k));
      const arr = [];
      let p = prev[k];
      for (let i = 0; i < 48; i++) {
        p = p * (1 + (rnd() - 0.48) * 0.006);
        arr.push(p);
      }
      arr[arr.length - 1] = prices[k];
      history[k] = arr;
    });
    return { prices, prev, history };
  }

  async function fetchLivePrices() {
    const symbols = Object.values(PRICE_FEEDS);
    const pairToTok = {};
    Object.keys(PRICE_FEEDS).forEach((tok) => { pairToTok[PRICE_FEEDS[tok]] = tok; });
    const urls = [
      "https://api.binance.com/api/v3/ticker/24hr?symbols=" + encodeURIComponent(JSON.stringify(symbols)),
      "https://data-api.binance.vision/api/v3/ticker/24hr?symbols=" + encodeURIComponent(JSON.stringify(symbols)),
    ];
    for (const url of urls) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) continue;
        const rows = await res.json();
        if (!Array.isArray(rows) || !rows.length) continue;
        const prices = { USDT: 1 };
        const prev = { USDT: 1 };
        rows.forEach((r) => {
          const tok = pairToTok[r.symbol];
          if (!tok) return;
          const p = parseFloat(r.lastPrice);
          const pr = parseFloat(r.prevClosePrice);
          if (p > 0) prices[tok] = p;
          if (pr > 0) prev[tok] = pr;
        });
        if (prices.BTC && prices.ETH) return { prices, prev };
      } catch (_) {
        /* try next endpoint */
      } finally {
        clearTimeout(timer);
      }
    }
    return null;
  }

  function px(sym) { return S.prices[sym] ?? TOKENS[sym]?.seed ?? 0; }
  function pxPrev(sym) { return S.prev[sym] ?? px(sym); }
  function chgPct(sym) {
    const a = px(sym), b = pxPrev(sym);
    if (!b) return 0;
    return ((a - b) / b) * 100;
  }
  function balKey(t, n) { return t + ":" + n; }
  function getBal(t, n) {
    const row = S.balances.find((b) => b.token === t && b.network === n);
    return row ? row.amount : 0;
  }
  function setBal(t, n, amount) {
    let row = S.balances.find((b) => b.token === t && b.network === n);
    if (!row) {
      if (amount <= 0) return;
      S.balances.push({ token: t, network: n, amount });
      return;
    }
    row.amount = amount;
    if (row.amount <= 1e-16) S.balances = S.balances.filter((b) => b !== row);
  }
  function addBal(t, n, delta, costUsdDelta) {
    setBal(t, n, getBal(t, n) + delta);
    const id = balKey(t, n);
    const c = S.cost[id] || { qty: 0, costUsd: 0 };
    if (delta >= 0) {
      c.qty += delta;
      c.costUsd += costUsdDelta != null ? costUsdDelta : delta * px(t);
    } else {
      const sold = -delta;
      const avg = c.qty ? c.costUsd / c.qty : px(t);
      c.qty = Math.max(0, c.qty - sold);
      c.costUsd = c.qty * avg;
    }
    S.cost[id] = c;
  }
  function portfolio() {
    let total = 0, prev = 0;
    S.balances.forEach((b) => {
      total += b.amount * px(b.token);
      prev += b.amount * pxPrev(b.token);
    });
    const chg = total - prev;
    const pct = prev ? (chg / prev) * 100 : 0;
    return { total, prev, chg, pct };
  }
  function tokenValue(b) { return b.amount * px(b.token); }
  function tokenShare(total) {
    const tokenSum = S.balances.reduce((s, b) => s + tokenValue(b), 0);
    return total ? (tokenSum / total) * 100 : 0;

  function pnlAll() {
    let cost = 0, value = 0;
    const rows = [];
    const map = {};
    S.balances.forEach((b) => {
      const id = balKey(b.token, b.network);
      const c = S.cost[id] || { qty: b.amount, costUsd: b.amount * px(b.token) };
      const v = b.amount * px(b.token);
      cost += c.costUsd;
      value += v;
      const key = b.token;
      if (!map[key]) map[key] = { token: key, qty: 0, cost: 0, value: 0 };
      map[key].qty += b.amount;
      map[key].cost += c.costUsd;
      map[key].value += v;
    });
    Object.values(map).forEach((r) => {
      r.avg = r.qty ? r.cost / r.qty : 0;
      r.u = r.value - r.cost;
      r.pct = r.cost ? (r.u / r.cost) * 100 : 0;
      rows.push(r);
    });
    rows.sort((a, b) => b.value - a.value);
    return { rows, cost, value, u: value - cost, pct: cost ? ((value - cost) / cost) * 100 : 0 };
  }

  function walkPrices(amp = 1) {
    if (frozen) return;
    Object.keys(TOKENS).forEach((k) => {
      if (k === "USDT" || k === "USDC") {
        const peg = 1 + (Math.random() - 0.5) * 0.0004 * amp;
        S.prices[k] = clamp(S.prices[k] * 0.4 + peg * 0.6, 0.997, 1.003);
      } else {
        const shock = (Math.random() - 0.5) * 0.004 * amp;
        S.prices[k] = Math.max(0.0001, S.prices[k] * (1 + shock));
      }
      const h = S.history[k] || [];
      h.push(S.prices[k]);
      if (h.length > 60) h.shift();
      S.history[k] = h;
    });
    save();

    const from = ui.swap.from, to = ui.swap.to;
    const a = Number(amount);
    if (!a || a <= 0) return { out: 0, rate: px(from) / px(to), impact: 0, fee: 0, min: 0 };
    const usd = a * px(from);
    const impact = clamp(Math.sqrt(Math.max(usd, 0.0001)) * 0.08, 0.01, 0.8);
    const fee = Math.min(Math.max(usd * 0.0025, 0), usd * 0.04);
    const out = Math.max(0, ((usd - fee) * (1 - impact / 100)) / px(to));
    const slip = currentSlip();
    const min = out * (1 - slip / 100);
    return { out, rate: px(from) / px(to), impact, fee, min, usd };
  }

  function openSwap() {
    if (!ui.swap.from) ui.swap.from = "ETH";

  function doReviewSwap() {
    const sw = ui.swap;
    const q = quoteSwap(sw.amount);
    ui.confirm = Object.assign({}, sw, { amount: Number(sw.amount) }, q, { slip: currentSlip() });
    openSheet("swap-review", swapSheetHtml("review"), { mid: true });
  }

  function doConfirmSwap() {
    const c = ui.confirm;
    if (!c) return;
    openSheet("swap-pend", swapSheetHtml("pending"), { mid: true });
    const force = window.__PX && window.__PX.forceSwap;
    setTimeout(() => {
      const q2 = quoteSwap(c.amount);
      const slip = c.slip;
      const moved = Math.abs(q2.out - c.out) / (c.out || 1);
      const failRand = force === "ok" ? false : force === "fail" ? true : Math.random() < FAIL_RATE;
      const failSlip = moved * 100 > slip * 1.8;
      if (failRand || failSlip) {
        recordActivity({
          type: "swap", status: "failed",
          from: c.from, fromNet: c.fromNet, to: c.to, toNet: c.toNet,
          amount: c.amount, out: 0,
          reason: "Trượt giá vượt mức",
        });
        ui.confirm = Object.assign({}, c, { reason: "Trượt giá vượt mức. Số dư không đổi." });
        openSheet("swap-fail", swapSheetHtml("fail"), { mid: true });
        return;
      }
      addBal(c.from, c.fromNet, -c.amount, -c.amount * px(c.from));
      addBal(c.to, c.toNet, q2.out, q2.out * px(c.to));
      ui.confirm = Object.assign({}, c, { out: q2.out });
      recordActivity({
        type: "swap", status: "confirmed",
        from: c.from, fromNet: c.fromNet, to: c.to, toNet: c.toNet,
        amount: c.amount, out: q2.out,
      });
      save();
      renderMain();
      openSheet("swap-ok", swapSheetHtml("success"), { mid: true });
    }, 1100);
  }

  function chartSVG(sym, w, h, pad) {
    pad = pad == null ? 8 : pad;
    const data = (S.history[sym] || []).slice();
    if (data.length < 2) data.push(px(sym), px(sym));
    const min = Math.min.apply(null, data), max = Math.max.apply(null, data);
    const span = max - min || max * 0.01 || 1;
    const n = data.length;
    const innerW = w - pad * 2, innerH = h - pad * 2;
    const pts = data.map((v, i) => {
      const x = pad + (i / (n - 1)) * innerW;
      const y = pad + (1 - (v - min) / span) * innerH;
      return [x, y];
    });
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    const area = d + ` L${last[0].toFixed(1)} ${h - pad} L${pad} ${h - pad} Z`;
    const up = chgPct(sym) >= 0;
    const col = up ? "#1f7a3a" : "#c0392b";
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <path d="${area}" fill="${col}" fill-opacity=".1"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>`;
  }

  function pickTokenSheet(which) {

        const t = TOKENS[sym];
        const blob = (t.name + " " + t.symbol + " " + NETWORKS[net].name).toLowerCase();

        opts.push({ sym, net, amt, t });

    const items = opts.map((o) => `<button class="token-row" data-act="choose-tok" data-id="${o.sym}:${o.net}">

      <div class="tok-right"><div class="tok-usd">${vi.qty(o.amt,o.t.decimals)} ${o.t.symbol}</div></div>
    </button>`).join("");
    return headBar("Chọn token") + `<div class="sheet-body">
      <div class="search-box">${I.search}<input data-input="tok-q" placeholder="Tìm tên hoặc mã" value="${ui.tokenQuery||""}"></div>
      <div class="token-list" style="padding:0">${items || '<div class="empty">Không có kết quả</div>'}</div>
    </div>`;
  }

  function accountSheet() {
    return headBar("Tài khoản") + `<div class="sheet-body">
      <button class="set-row on" data-act="close-sheet">
        ${identicon(ADDR, 28)}
        <div class="grow"><div>Imported Account 1</div><div class="val">${ADDR_SHORT}</div></div>
        <span style="color:var(--green)">${I.check}</span>
      </button>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">Bản mô phỏng chỉ có một tài khoản demo. Không thể nhập ví hay khóa.</p>
    </div>`;
  }

  function menuSheet() {
    return headBar("Menu") + `<div class="sheet-body"><div class="menu-list">
      <button class="menu-item" data-act="settings"><span class="ic">${I.gear}</span><span>Cài đặt</span></button>
      <button class="menu-item" data-act="activity"><span class="ic">${I.clock}</span><span>Hoạt động</span></button>
      <button class="menu-item" data-act="tab-finance"><span class="ic">${I.finance}</span><span class="grow">Lãi / lỗ<div class="sub">PnL chưa thực hiện theo token</div></span></button>
      <button class="menu-item" data-act="about"><span class="ic">${I.info}</span><span>Giới thiệu</span></button>
    </div></div>`;
  }

  function settingsSheet(confirmReset) {
    if (confirmReset) {
      return headBar("Đặt lại") + `<div class="sheet-body">
        <p>Xóa toàn bộ số dư, lịch sử và đặt lại tài khoản demo? Thao tác này chỉ ảnh hưởng dữ liệu mô phỏng trên máy bạn.</p>
      </div><div class="sheet-foot"><div class="btn-row"><button class="btn btn-ghost" data-act="settings">Hủy</button><button class="btn btn-danger" data-act="do-reset">Đặt lại</button></div></div>`;
    }
    const nets = Object.values(NETWORKS).map((n) => `<button class="set-row ${S.network===n.id?"on":""}" data-act="set-net" data-id="${n.id}"><span class="grow">${n.name}</span><span class="val">${n.short}</span></button>`).join("");
    return headBar("Cài đặt") + `<div class="sheet-body">
      <div class="set-group"><div class="set-label">Mạng (mô phỏng)</div>${nets}</div>
      <div class="set-group"><div class="set-label">Mô phỏng</div>
        <button class="set-row" data-act="reset-ask"><span class="grow">Đặt lại mô phỏng</span><span class="val">Xóa dữ liệu local</span></button>
      </div>
      <p style="font-size:12px;color:var(--muted)">Project X Wallet là tên tạm. Ứng dụng chạy hoàn toàn ngoại tuyến, không kết nối RPC hay chuỗi thật.</p>
    </div>`;
  }

  function aboutSheet() {
    return headBar("Giới thiệu") + `<div class="sheet-body" style="text-align:center;padding-top:16px">
      ${logoMark(72)}
      <h3 style="margin-top:12px;font-size:18px;font-weight:700">Project X Wallet</h3>
      <p style="color:var(--muted);font-size:13px;margin:4px 0 16px">Tên tạm · Bản mô phỏng giao dịch spot</p>
      <p style="font-size:13px;color:var(--muted);line-height:1.5;text-align:left">Công cụ này mô phỏng giao diện ví và lệnh giao ngay để thử nghiệm. Không phải ví thật, không giữ khóa, không kết nối mạng, không thể gửi hay nhận tài sản thật.</p>
    </div>` + footBtn("Đóng","close-sheet");
  }

  function tradeSheet() {
    return `<div class="sheet-head"><div></div><h2>Giao dịch</h2><button class="icon-btn" data-act="close-sheet">${I.close}</button></div>
      <div class="sheet-body"><div class="menu-list">
        <button class="menu-item" data-act="swap"><span class="ic">${I.swap}</span><span class="grow">Hoán đổi<div class="sub">Đổi token với báo giá mô phỏng</div></span></button>
        <button class="menu-item" data-act="send"><span class="ic">${I.send}</span><span class="grow">Gửi<div class="sub">Chuyển trong mô phỏng tới địa chỉ 0x</div></span></button>
        <button class="menu-item" data-act="recv"><span class="ic">${I.recv}</span><span class="grow">Nhận<div class="sub">Hiện địa chỉ giả lập</div></span></button>
        <button class="menu-item" data-act="buy"><span class="ic">${I.buy}</span><span class="grow">Mua<div class="sub">Cộng USDT thử nghiệm tức thì</div></span></button>
      </div></div>`;
  }

  function searchSheet() {
    const q = (ui.tokenQuery || "").trim().toLowerCase();
    const rows = S.balances.filter((b) => {
      const t = TOKENS[b.token];
      return !q || (t.name + t.symbol + NETWORKS[b.network].name).toLowerCase().indexOf(q) >= 0;
    }).map((b) => {
      const t = TOKENS[b.token];
      return `<button class="token-row" data-act="token" data-id="${b.token}:${b.network}">
        <div class="tok-ic"><div class="mark">${tokenMark(b.token,40)}</div>${chainBadge(b.network)}</div>
        <div class="tok-mid"><div class="tok-name">${t.name}</div><div class="tok-px">${NETWORKS[b.network].name}</div></div>
        <div class="tok-right"><div class="tok-usd">${vi.usdPlain(tokenValue(b),2)}</div></div>
      </button>`;
    }).join("");
    return headBar("Tìm kiếm") + `<div class="sheet-body">
      <div class="search-box">${I.search}<input data-input="tok-q" placeholder="Tìm token" value="${ui.tokenQuery||""}"></div>
      ${rows || '<div class="empty">Không có kết quả</div>'}
    </div>`;
  }

  function refreshLive() {
    const p = portfolio();
    const el = document.querySelector("[data-live=total]");
    if (el) el.textContent = vi.usdPlain(p.total, 2);
    const sm = document.querySelector("[data-live=total-sm]");
    if (sm) sm.textContent = vi.usdPlain(p.total, 2);
    const td = document.querySelector("[data-live=today]");
    if (td) {
      const dollarChg = Math.round(p.chg);
      const sign = p.pct >= 0 ? "+$" : "-$";
      td.classList.toggle("neg", p.pct < 0);
      td.innerHTML = `${sign}${Math.abs(dollarChg)} (${vi.pct(p.pct)}) <span class="label">Hôm nay</span>`;
    }
    const clk = document.querySelector("[data-clock]");
    if (clk) clk.textContent = vi.clock(now());
    renderFullPane();
  }

  function renderMain() {
    const scroll = $("#scroll-inner");
    if (scroll) {
      const y = $("#scroll") ? $("#scroll").scrollTop : 0;
      scroll.innerHTML = scrollContent();
      if ($("#scroll")) $("#scroll").scrollTop = y;
    }
    const tb = $("#tabbar");
    if (tb) tb.innerHTML = tabbarHtml();
    renderFullPane();
  }

  function renderAll() {
    $("#status-bar").innerHTML = statusBarHtml();
    $("#app-header").innerHTML = headerHtml();
    $("#welcome").classList.toggle("hidden", S.started);
    $("#app-main").style.visibility = S.started ? "visible" : "hidden";
    renderMain();
  }

  function renderFullPane() {
    const pane = $("#full-pane");
    const stage = document.querySelector(".stage");
    if (!pane || !stage || !stage.classList.contains("full")) return;
    const parts = (ui.selected || "ETH:ethereum").split(":");
    const token = parts[0], network = parts[1];
    const t = TOKENS[token] || TOKENS.ETH;
    const net = NETWORKS[network] || NETWORKS.ethereum;
    pane.innerHTML = `
      <div class="full-pane-head">
        <div>
          <h2>${t.name} / USDT</h2>
          <div class="pair-meta">${net.name} · ${vi.usdPlain(px(token), px(token)>=100?2:4)} · 24h ${vi.pct(chgPct(token))}</div>
        </div>
        <div class="pair-meta">Giá thị trường · Số dư mô phỏng</div>
      </div>
      <div class="full-chart">${chartSVG(token, 640, 420, 16)}</div>`;
  }

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(ui.toastTimer);
    ui.toastTimer = setTimeout(() => el.classList.remove("on"), 1600);
  }

  function copyAddr() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ADDR).catch(function(){});
    }
    toast("Đã sao chép " + ADDR_SHORT);
  }

  function bindSheet(root) {
    /* events already handled on document — do not rebind */
  }

  function onInput(e) {
    const input = e.target.closest("[data-input]");
    if (!input) return;
    const key = input.getAttribute("data-input");
    const v = input.value;
    if (key === "swap-amt") {
      ui.swap.amount = v.replace(",", ".").replace(/[^\d.]/g, "");
      if (ui.sheet === "swap") openSheet("swap", swapSheetHtml(), { tall: true });
      const el = document.querySelector("[data-input=swap-amt]");
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    }
    if (key === "slip-custom") {
      S.useCustomSlip = true;
      S.customSlippage = vi.parseSlip(v);
      save();
      if (ui.sheet === "swap") openSheet("swap", swapSheetHtml(), { tall: true });
      const el = document.querySelector("[data-input=slip-custom]");
      if (el) { el.focus(); const n = String(el.value).replace("%","").length; el.setSelectionRange(n, n); }
    }
    if (key === "send-to") { ui.send.to = v; if (ui.sheet === "send") openSheet("send", sendSheet(), { mid: false }); }
    if (key === "send-amt") { ui.send.amount = v.replace(",", ".").replace(/[^\d.]/g, ""); if (ui.sheet === "send") openSheet("send", sendSheet()); }
    if (key === "buy-custom") { ui.buyAmt = parseFloat(String(v).replace(",", ".")) || 0; }
    if (key === "tok-q") {
      ui.tokenQuery = v;
      if (ui.sheet === "pick") openSheet("pick", pickTokenSheet(ui.tokenPickFor), { tall: true });
      if (ui.sheet === "search") openSheet("search", searchSheet(), { tall: true });
      const el = document.querySelector("[data-input=tok-q]");
      if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
    }
  }

  function onAction(e) {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    const id = btn.getAttribute("data-id");
    const v = btn.getAttribute("data-v");

    if (act === "start") { S.started = true; save(); renderAll(); return; }
    if (act === "close-sheet") { closeSheet(); return; }
    if (act === "copy") { copyAddr(); return; }
    if (act === "account") { openSheet("acct", accountSheet(), { mid: true }); return; }
    if (act === "menu") { openSheet("menu", menuSheet(), { mid: true }); return; }
    if (act === "settings") { openSheet("settings", settingsSheet(), { mid: true }); return; }
    if (act === "about") { openSheet("about", aboutSheet(), { mid: true }); return; }
    if (act === "reset-ask") { openSheet("reset", settingsSheet(true), { mid: true }); return; }
    if (act === "do-reset") { closeSheet(); resetAll(); toast("Đã đặt lại mô phỏng"); return; }
    if (act === "set-net") { S.network = id; save(); openSheet("settings", settingsSheet(), { mid: true }); return; }
    if (act === "search") { ui.tokenQuery = ""; openSheet("search", searchSheet(), { tall: true }); return; }
    if (act === "activity") { openSheet("activity", activitySheet(), { tall: true }); return; }
    if (act === "act-detail") { openSheet("act-d", activitySheet(id), { mid: true }); return; }
    if (act === "dismiss-promo") { e.stopPropagation(); S.promoDismissed = true; save(); renderMain(); return; }
    if (act === "tab-home") { S.tab = "home"; closeSheet(); renderMain(); return; }
    if (act === "tab-explore") { S.tab = "explore"; closeSheet(); renderMain(); return; }
    if (act === "tab-finance") { S.tab = "finance"; closeSheet(); renderMain(); return; }
    if (act === "tab-rewards") { S.tab = "rewards"; closeSheet(); renderMain(); return; }
    if (act === "trade") { openSheet("trade", tradeSheet(), { mid: true }); return; }
    if (act === "buy") { openSheet("buy", buySheet(), { mid: true }); return; }
    if (act === "buy-amt") { ui.buyAmt = Number(v); openSheet("buy", buySheet(), { mid: true }); return; }
    if (act === "confirm-buy") { doBuy(); return; }
    if (act === "swap" || act === "swap-from") {
      if (act === "swap-from" && id) {
        const p = id.split(":");
        ui.swap.from = p[0]; ui.swap.fromNet = p[1];
        if (ui.swap.to === p[0] && ui.swap.toNet === p[1]) {
          ui.swap.to = p[0] === "USDT" ? "ETH" : "USDT";
          ui.swap.toNet = "ethereum";
        }
      }
      openSwap(); return;
    }
    if (act === "flip") {
      const s = ui.swap;
      ui.swap = { from: s.to, fromNet: s.toNet, to: s.from, toNet: s.fromNet, amount: "", quote: 0 };
      openSwap(); return;
    }
    if (act === "max") {
      ui.swap.amount = String(getBal(ui.swap.from, ui.swap.fromNet));
      openSwap(); return;
    }
    if (act === "slip") { S.slippage = Number(v); S.useCustomSlip = false; save(); openSwap(); return; }
    if (act === "review-swap") { doReviewSwap(); return; }
    if (act === "confirm-swap") { doConfirmSwap(); return; }
    if (act === "pick-from") { ui.tokenQuery = ""; openSheet("pick", pickTokenSheet("from"), { tall: true }); return; }
    if (act === "pick-to") { ui.tokenQuery = ""; openSheet("pick", pickTokenSheet("to"), { tall: true }); return; }
    if (act === "pick-send") { ui.tokenQuery = ""; openSheet("pick", pickTokenSheet("send"), { tall: true }); return; }
    if (act === "choose-tok") {
      const p = id.split(":");
      if (ui.tokenPickFor === "from") { ui.swap.from = p[0]; ui.swap.fromNet = p[1]; openSwap(); }
      else if (ui.tokenPickFor === "to") { ui.swap.to = p[0]; ui.swap.toNet = p[1]; openSwap(); }
      else if (ui.tokenPickFor === "send") { ui.send.token = p[0]; ui.send.network = p[1]; openSheet("send", sendSheet()); }
      return;
    }
    if (act === "send" || act === "send-from") {
      if (act === "send-from" && id) { const p = id.split(":"); ui.send.token = p[0]; ui.send.network = p[1]; }
      openSheet("send", sendSheet()); return;
    }
    if (act === "max-send") { ui.send.amount = String(getBal(ui.send.token, ui.send.network)); openSheet("send", sendSheet()); return; }
    if (act === "confirm-send") { doSend(); return; }
    if (act === "recv") { openSheet("recv", recvSheet(), { mid: true }); return; }
    if (act === "token") { openSheet("token", tokenDetailSheet(id), { tall: true }); return; }
    if (act === "scroll-tokens") {
      S.tab = "home"; renderMain();
      const el = document.getElementById("token-section");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (act === "fullview") {
      const stage = document.querySelector(".stage");
      stage.classList.toggle("full");
      document.body.classList.toggle("is-full");
      btn.textContent = stage.classList.contains("full") ? "Xem dạng điện thoại" : "Xem rộng";
      renderFullPane();
      return;
    }
  }

  function setupPTR() {
    const sc = $("#scroll");
    const inner = $("#scroll-inner");
    const ptr = $("#ptr");
    let startY = 0, startX = 0, pulling = false, armed = false;
    const MAX = 88, TH = 56;

    const onDown = (y, x) => {
      if (ui.ptr.refreshing) return;
      if (sc.scrollTop <= 0) { armed = true; startY = y; startX = x; pulling = false; }
    };
    const onMove = (y, x, ev) => {
      if (!armed || ui.ptr.refreshing) return;
      const dy = y - startY, dx = x - startX;
      if (!pulling && dy > 6 && Math.abs(dy) > Math.abs(dx)) pulling = true;
      if (!pulling) return;
      if (ev && ev.cancelable) ev.preventDefault();
      const d = clamp(dy * 0.42, 0, MAX);
      ui.ptr.y = d;
      inner.style.transform = "translateY(" + d + "px)";
      ptr.style.transform = "translateY(" + (d - 56) + "px)";
      ptr.classList.toggle("spin", d > TH);
    };
    const onUp = () => {
      if (!armed) return;
      armed = false;
      if (pulling && ui.ptr.y >= TH) refreshNow();
      else resetPTR();
      pulling = false;
    };
    function resetPTR() {
      inner.style.transition = "transform 200ms ease";
      ptr.style.transition = "transform 200ms ease";
      inner.style.transform = "";
      ptr.style.transform = "";
      ptr.classList.remove("spin");
      ui.ptr.y = 0;
      setTimeout(() => { inner.style.transition = ""; ptr.style.transition = ""; }, 200);
    }
    function refreshNow() {
      ui.ptr.refreshing = true;
      inner.style.transition = "transform 180ms ease";
      ptr.style.transition = "transform 180ms ease";
      inner.style.transform = "translateY(56px)";
      ptr.style.transform = "translateY(0)";
      ptr.classList.add("spin");
      const finish = (ok) => {
        ui.ptr.refreshing = false;
        resetPTR();
        renderMain();
        toast(ok ? "Đã làm mới giá thị trường" : "Không lấy được giá, dùng giá tạm");
      };
      fetchLivePrices().then((live) => {
        if (live) { applyLiveTick(live); finish(true); }
        else { walkPrices(2.2); finish(false); }
      });
    }
    sc.addEventListener("touchstart", (e) => onDown(e.touches[0].clientY, e.touches[0].clientX), { passive: true });
    sc.addEventListener("touchmove", (e) => onMove(e.touches[0].clientY, e.touches[0].clientX, e), { passive: false });
    sc.addEventListener("touchend", onUp);
    sc.addEventListener("touchcancel", onUp);
    sc.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch") return; onDown(e.clientY, e.clientX); });
    window.addEventListener("pointermove", (e) => { if (e.pointerType === "touch") return; onMove(e.clientY, e.clientX, e); });
    window.addEventListener("pointerup", (e) => { if (e.pointerType === "touch") return; onUp(); });

    window.__PX = window.__PX || {};
    window.__PX.showPullRefresh = () => {
      ui.ptr.refreshing = true;
      inner.style.transform = "translateY(56px)";
      ptr.style.transform = "translateY(0)";
      ptr.classList.add("spin");
    };
  }

  setInterval(() => {
    const clk = document.querySelector("[data-clock]");
    if (clk) clk.textContent = vi.clock(now());
  }, 10000);

  function boot() {
    load();
    const params = new URLSearchParams(location.search);
    if (params.get("freeze") === "1" || params.get("shot") === "1") frozen = true;
    if (params.get("autostart") === "1") { S.started = true; }
    document.addEventListener("click", onAction);
    document.addEventListener("input", onInput);
    $("#backdrop").addEventListener("click", closeSheet);
    renderAll();
    setupPTR();
    ensureDemoAccount().then(() => { if (S.started) renderAll(); });
    if (!frozen) startClock();

    window.__PX = Object.assign(window.__PX || {}, {
      start() { S.started = true; save(); renderAll(); },
      reset: resetAll,
      openSwap, openSheet, closeSheet,
      doReviewSwap, doConfirmSwap,
      openActivity() { openSheet("activity", activitySheet(), { tall: true }); },
      openToken(id) { openSheet("token", tokenDetailSheet(id || "ETH:ethereum"), { tall: true }); },
      openBuy() { openSheet("buy", buySheet(), { mid: true }); },
      openSend() { openSheet("send", sendSheet()); },
      openRecv() { openSheet("recv", recvSheet(), { mid: true }); },
      openTrade() { openSheet("trade", tradeSheet(), { mid: true }); },
      fullView() { document.querySelector(".stage").classList.add("full"); document.body.classList.add("is-full"); var b=document.querySelector('[data-act="fullview"]'); if(b) b.textContent="Xem dạng điện thoại"; renderFullPane(); },
      phoneView() { document.querySelector(".stage").classList.remove("full"); document.body.classList.remove("is-full"); },
      setSwap(amt) { ui.swap.amount = String(amt); openSwap(); },
      state: () => S,
      ui: () => ui,
      freeze(v) { frozen = !!v; },
      forceSwap: "ok",
      portfolio, walkPrices, renderMain, renderAll, toast,
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

  </script>
  <script>
    (function(){
      function inject(){
        var slot = document.querySelector('#welcome .logo-slot');
        if (!slot) return;
        slot.innerHTML = '<svg class="logo-mark" width="72" height="72" viewBox="0 0 72 72" fill="none"><rect width="72" height="72" rx="18" fill="#3c4fd8"/><path d="M22 38.5L36 18l14 20.5H22z" fill="#fff" fill-opacity=".95"/><path d="M26.5 41.5h19L36 55 26.5 41.5z" fill="#c9d0ff"/><path d="M36 18v23.5" stroke="#2a38a8" stroke-width="1.4" opacity=".35"/></svg>';
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inject);
      else inject();
    })();
  </script>
